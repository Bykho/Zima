sim:
  urdf: assets/SO-ARM100/Simulation/SO101/so101_new_calib.urdf
  mjcf: assets/so101/chess_scene.xml
  use_gui: true
  timestep: 0.004166666666666667
  gravity: -9.81
  # Board is 85% of the 47.5 mm layout (40.375 mm squares). Piece meshes
  # stay the same size — only square centers move. origin_x = arm_x + 0.08;
  # origin_y = arm_y - 4 * square.
  arm_base_position: [0.08, 0.045, 0.0]
  motor_force: 200.0
  pickup:
    source: d1
    dest: d4
    observe_z: 0.12
    pregrasp_z: 0.10
    grasp_z: 0.015
    lift_z: 0.08
    place_hover: 0.0
    release_lift_z: 0.08
    place_xy_tol: 0.018
    # 3/4 of the 0.8 full-open pose. Enough to clear a piece; the joint
    # stop (~1.75) slaps it. Approach may still narrow this for neighbors.
    gripper_open: 0.60
    # Release only. 0.30 ≈ 40 mm jaw gap (approach stays at 0.60 / ~63 mm).
    gripper_release: 0.30
    # Extra tries if a miss/drop leaves the piece upright on the board.
    grasp_retries: 1
    gripper_closed: -0.12
    close_steps: 220
    lift_clearance: 0.04
    # EE height above the board used only when the straight carry is blocked.
    # Lift already reaches ~0.12 m world (~0.10 above the board); 0.08 is a
    # floor that does not add extra raise on the d1→d4 d2-clearance path.
    transport_clearance_z: 0.08
    # Grasp EE offset from the believed object XY. Recentered so the pinch
    # lies on the piece (old [3.76, 8.66] sat ~3 mm toward -X/+Y).
    grasp_xy_offset: [0.00716, 0.00616]
  board:
    # 40.375 mm squares (15% smaller than 47.5 mm). Pieces are not scaled.
    origin: [0.16, -0.1165, 0.0]
    square_size: 0.040375
    surface_z: 0.02
    # Drop captured pieces here (past the h-file, mid-ranks).
    capture_bowl: [0.35, -0.26, 0.024]
    # Well beside the bowl. Fallen pieces are inserted here to stand up.
    reorient_nest: [0.22, -0.26, 0.024]
    yaw: 0.0
    # ee_link: hover IK target (see board.py module doc)
    ee_link: gripper_frame_link
    ee_rpy: [3.14159, 0.0, 0.0]
    show_grid: true
    show_checker: true
    show_markers: true
    marker_radius: 0.012
    marker_rgba: [0.95, 0.05, 0.05, 1.0]
    show_pieces: true
    start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR
    pick_hover: 0.09
    gripper_travel_z: 0.132
  grasp:
    # ik_link: jaw contact point for descend/carry (see board.py module doc)
    ik_link: gripper_link
    descend_steps: 14
    travel_steps: 10
    travel_tolerance: 0.14
    min_contact_points: 1
    min_normal_force: 0.05
    close_steps: 100
    settle_steps: 40
    gripper_force: 150.0
    friction: 1.5
    timeout_s: 4.0
  camera:
    # RealSense D405 on official SO-ARM Wrist_Roll_D405_Holder (so101.xml).
    # Wrist RGB-D backend is sim/sensor.py → generic RgbdObservation.
    # MuJoCo pose is the XML camera; these fields are unused by the MJCF path.
    mount_link: gripper_link
    aim_link: gripper_frame_link
    eye_xyz: [0.03, 0.05, -0.02]
    # gripper_frame +X/+Y toward workspace (not -Z back into the arm)
    target_xyz: [0.16, 0.13, 0.02]
    up_link: gripper_link
    up_local: [0.0, 1.0, 0.0]
    look_at: offset  # or board_plane to aim at square under jaws
    width: 320
    height: 240
    fov: 75
    preview_hz: 12
    near: 0.01
    far: 1.0
  scan:
    stride: 1
    voxel: 0.003
    far: 0.75
    hover: 0.24
    margin: 0.04
    z_min: 0.015
    z_max: 0.12
    move_duration: 0.5
    settle_steps: 8
    squares: [a1, a8, h1, h8, e4]
  locate:
    hover: 0.28
    squares: [e4, a1, a8, h1, h8]
    move_duration: 0.5
    settle_steps: 8
    far: 0.85
  voxels:
    size: 0.004
    z_clear: 0.008
    z_max: 0.055
    hover: 0.28
    squares: [a1, a8, h1, h8]
    stride: 1
    far: 0.85

joints:
  - shoulder_pan
  - shoulder_lift
  - elbow_flex
  - wrist_flex
  - wrist_roll
  - gripper

poses:
  home:
    shoulder_pan: 0.0
    shoulder_lift: 0.0
    elbow_flex: 0.0
    wrist_flex: 0.0
    wrist_roll: 0.0
    gripper: 0.8
  reach:
    shoulder_pan: 0.6
    shoulder_lift: -0.9
    elbow_flex: 1.2
    wrist_flex: -0.3
    wrist_roll: 0.0
    gripper: 0.8
  gripper_closed:
    gripper: 0.0
  above_board:
    shoulder_pan: 0.35
    shoulder_lift: -0.55
    elbow_flex: 0.85
    wrist_flex: -0.35
    wrist_roll: 0.0
    gripper: 0.8
  # Seed from menagerie box-pickup: gripperframe +X already world-down.
  vertical_seed:
    shoulder_pan: 0.0
    shoulder_lift: 0.0
    elbow_flex: 0.47
    wrist_flex: 1.18
    wrist_roll: 1.58
    gripper: 0.60

real:
  port: null
  robot_id: follower_arm
  goal_velocity: 120
  joints:
    - shoulder_pan
    - shoulder_lift
    - elbow_flex
    - wrist_flex
    - wrist_roll
    - gripper

sync:
  nudge_rad: 0.2
  rate_hz: 30
  joints:
    - shoulder_pan
    - shoulder_lift
    - elbow_flex
    - wrist_flex
    - wrist_roll

safety:
  max_delta_ticks: 12
  max_tracking_error: 120
  max_load: 850
  fault_streak: 6
